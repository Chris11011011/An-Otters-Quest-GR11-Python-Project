name: Inspect project archive

on:
  push:
    paths:
      - ".github/workflows/inspect-archive.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect archive contents
        run: |
          set -e
          ZIP="An_Otters_Quest_a_Tale_of_Unity_COMPLETE.zip"
          echo "=== ZIP LISTING ==="
          unzip -l "$ZIP"
          echo "=== EXTRACTED TREE ==="
          rm -rf /tmp/otter
          mkdir -p /tmp/otter
          unzip -q "$ZIP" -d /tmp/otter
          find /tmp/otter -maxdepth 4 -type f | sort
