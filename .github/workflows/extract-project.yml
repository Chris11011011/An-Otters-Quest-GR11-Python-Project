name: Extract original project

on:
  push:
    paths:
      - ".github/workflows/extract-project.yml"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract original Processing project
        run: |
          set -e
          ZIP="An_Otters_Quest_a_Tale_of_Unity_COMPLETE.zip"
          unzip -q "$ZIP"
          rm "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract original Grade 11 Python project"
          git push
