name: Build portable Windows game

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-portable-windows.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build self-contained Windows package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repoRoot = $env:GITHUB_WORKSPACE
          $buildRoot = Join-Path $repoRoot "_portable_build"
          New-Item -ItemType Directory -Force -Path $buildRoot | Out-Null

          function Get-Download {
            param(
              [string[]]$Urls,
              [string]$OutFile
            )

            foreach ($url in $Urls) {
              try {
                Write-Host "Downloading $url"
                Invoke-WebRequest -UseBasicParsing -Uri $url -OutFile $OutFile
                if ((Test-Path $OutFile) -and ((Get-Item $OutFile).Length -gt 10000)) {
                  Write-Host "Downloaded $((Get-Item $OutFile).Length) bytes"
                  return
                }
              } catch {
                Write-Warning "Download failed: $url"
                Write-Warning $_
                Remove-Item $OutFile -Force -ErrorAction SilentlyContinue
              }
            }

            throw "All download URLs failed for $OutFile"
          }

          # Processing 3.5.4 supplies the matching Processing core and a known-good Java 8 runtime.
          $processingZip = Join-Path $buildRoot "processing-3.5.4-windows64.zip"
          Get-Download -Urls @(
            "https://github.com/processing/processing/releases/download/processing-0270-3.5.4/processing-3.5.4-windows64.zip",
            "https://download.processing.org/processing-3.5.4-windows64.zip"
          ) -OutFile $processingZip

          $processingExtract = Join-Path $buildRoot "processing"
          Expand-Archive -Path $processingZip -DestinationPath $processingExtract -Force
          $processingExe = Get-ChildItem -Path $processingExtract -Filter "processing.exe" -Recurse | Select-Object -First 1
          if (-not $processingExe) {
            throw "Processing 3.5.4 was not extracted correctly."
          }
          $processingRoot = $processingExe.Directory.FullName
          Write-Host "Processing root: $processingRoot"

          # Archived Python Mode build for Processing 3.
          $pythonModeZip = Join-Path $buildRoot "PythonMode-for-Processing3.zip"
          Get-Download -Urls @(
            "https://raw.githubusercontent.com/tabreturn/processing.py-for-processing-4/main/PythonMode-for-Processing3.zip",
            "https://github.com/tabreturn/processing.py-for-processing-4/raw/main/PythonMode-for-Processing3.zip"
          ) -OutFile $pythonModeZip

          $pythonModeExtract = Join-Path $buildRoot "pythonmode"
          Expand-Archive -Path $pythonModeZip -DestinationPath $pythonModeExtract -Force
          $pythonModeJar = Get-ChildItem -Path $pythonModeExtract -Filter "PythonMode.jar" -Recurse | Select-Object -First 1
          if (-not $pythonModeJar) {
            throw "PythonMode.jar was not found in the Python Mode archive."
          }
          $pythonModeRoot = $pythonModeJar.Directory.Parent.FullName
          Write-Host "Python Mode root: $pythonModeRoot"

          # Create a standalone Processing.py fat JAR from the exact runtime pieces
          # used by Python Mode + Processing 3.5.4.
          $runtimeRoot = Join-Path $buildRoot "processing-py-runtime"
          New-Item -ItemType Directory -Force -Path $runtimeRoot | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $runtimeRoot "libraries") | Out-Null

          $jarTool = Join-Path $processingRoot "java\bin\jar.exe"
          if (-not (Test-Path $jarTool)) {
            throw "Bundled Java 8 jar.exe was not found."
          }

          $pythonModeDir = $pythonModeJar.Directory.FullName
          $jythonJar = Get-ChildItem -Path $pythonModeDir -Filter "jython*.jar" | Select-Object -First 1
          $guavaJar = Get-ChildItem -Path $pythonModeDir -Filter "guava*.jar" | Select-Object -First 1

          $coreDir = Join-Path $processingRoot "core\library"
          $coreJar = Join-Path $coreDir "core.jar"
          $gluegenJar = Join-Path $coreDir "gluegen-rt.jar"
          $joglJar = Join-Path $coreDir "jogl-all.jar"

          $required = @(
            $pythonModeJar.FullName,
            $jythonJar.FullName,
            $guavaJar.FullName,
            $coreJar,
            $gluegenJar,
            $joglJar
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Required runtime JAR missing: $file"
            }
          }

          $mergeDir = Join-Path $buildRoot "fatjar-contents"
          New-Item -ItemType Directory -Force -Path $mergeDir | Out-Null

          Push-Location $mergeDir
          try {
            foreach ($inputJar in $required) {
              Write-Host "Merging $(Split-Path $inputJar -Leaf)"
              & $jarTool xf $inputJar
              if ($LASTEXITCODE -ne 0) {
                throw "Failed extracting $inputJar"
              }
            }

            # Signed metadata from source JARs is invalid after merging.
            Remove-Item "META-INF\MANIFEST.MF" -Force -ErrorAction SilentlyContinue
            Get-ChildItem "META-INF" -File -ErrorAction SilentlyContinue |
              Where-Object { $_.Extension -in ".SF", ".RSA", ".DSA" } |
              Remove-Item -Force -ErrorAction SilentlyContinue

            $manifestPath = Join-Path $buildRoot "standalone-manifest.mf"
            [System.IO.File]::WriteAllText(
              $manifestPath,
              "Manifest-Version: 1.0`r`nMain-Class: jycessing.Runner`r`n`r`n",
              [System.Text.Encoding]::ASCII
            )

            $standaloneJar = Join-Path $runtimeRoot "processing-py.jar"
            & $jarTool cfm $standaloneJar $manifestPath .
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create standalone processing-py.jar"
            }
          } finally {
            Pop-Location
          }

          # Bundle the same Java 8 runtime shipped with Processing 3.5.4.
          $runtimeJre = Join-Path $runtimeRoot "jre"
          Copy-Item -Path (Join-Path $processingRoot "java") -Destination $runtimeJre -Recurse -Force

          # Add Minim 2.2.2 in Processing's expected libraries/minim layout.
          $minimZip = Join-Path $buildRoot "minim.zip"
          Get-Download -Urls @(
            "https://github.com/ddf/Minim/archive/refs/tags/2.2.2.zip",
            "https://github.com/ddf/Minim/archive/refs/tags/v2.2.2.zip",
            "https://github.com/ddf/Minim/archive/refs/heads/master.zip"
          ) -OutFile $minimZip

          $minimExtract = Join-Path $buildRoot "minim-extract"
          Expand-Archive -Path $minimZip -DestinationPath $minimExtract -Force
          $minimJar = Get-ChildItem -Path $minimExtract -Filter "minim.jar" -Recurse | Select-Object -First 1
          if (-not $minimJar) {
            throw "minim.jar was not found in the Minim archive."
          }
          $minimRoot = $minimJar.Directory.Parent.FullName
          $runtimeMinim = Join-Path $runtimeRoot "libraries\minim"
          Copy-Item -Path $minimRoot -Destination $runtimeMinim -Recurse -Force
          Write-Host "Minim installed at: $runtimeMinim"

          # Make an isolated build copy of the original game.
          $projectSource = Join-Path $repoRoot "An_Otters_Quest_a_Tale_of_Unity"
          $sketchRoot = Join-Path $buildRoot "sketch"
          Copy-Item -Path $projectSource -Destination $sketchRoot -Recurse -Force

          $sketchFile = Join-Path $sketchRoot "An_Otters_Quest_a_Tale_of_Unity.py"
          if (-not (Test-Path $sketchFile)) {
            throw "Source Python file was not found: $sketchFile"
          }

          # Processing.py contains its own Windows launcher generator. These lines
          # only package the build. When the finished EXE launches with --internal,
          # launcher.create() returns immediately and the original game code runs.
          $originalCode = Get-Content -Path $sketchFile -Raw
          $launcherHeader = @'
          import launcher
          launcher.create(name="An_Otters_Quest", bundle=["data"], platforms=["win"], outdir="dist.platforms")
          '@
          Set-Content -Path $sketchFile -Value ($launcherHeader + "`r`n" + $originalCode) -Encoding utf8

          Push-Location $runtimeRoot
          try {
            & (Join-Path $runtimeJre "bin\java.exe") -Xmx1024m -jar (Join-Path $runtimeRoot "processing-py.jar") $sketchFile
            if ($LASTEXITCODE -ne 0) {
              throw "Processing.py launcher generation failed with exit code $LASTEXITCODE"
            }
          } finally {
            Pop-Location
          }

          $generated = Join-Path $sketchRoot "dist.platforms\win"
          if (-not (Test-Path $generated)) {
            throw "Expected generated Windows launcher folder was not created: $generated"
          }

          # launcher.create makes an empty jre placeholder. Replace it with Java 8.
          $generatedJre = Join-Path $generated "jre"
          Remove-Item $generatedJre -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item -Path $runtimeJre -Destination $generatedJre -Recurse -Force

          # Capitalize the one file users need to open; keep its matching INI basename.
          $lowerExe = Join-Path $generated "an_otters_quest.exe"
          $lowerIni = Join-Path $generated "an_otters_quest.ini"
          if (Test-Path $lowerExe) {
            Rename-Item -Path $lowerExe -NewName "An_Otters_Quest.exe"
          }
          if (Test-Path $lowerIni) {
            Rename-Item -Path $lowerIni -NewName "An_Otters_Quest.ini"
          }

          $readme = @'
          An Otter's Quest: A Tale of Unity
          Windows x64 portable build

          HOW TO PLAY
          1. Extract this entire ZIP file.
          2. Double-click An_Otters_Quest.exe.
          3. Keep the other folders/files beside the EXE. They are the bundled runtime.

          No separate installation is required:
          - Processing.py runtime is bundled.
          - Java 8 is bundled.
          - Minim is bundled.
          - All original image/audio assets are bundled.

          Original Grade 11 project by Christopher Lee.
          '@
          Set-Content -Path (Join-Path $generated "README - How to Play.txt") -Value $readme -Encoding utf8

          Get-ChildItem -Path $generated -Recurse -Include "*.out.txt","*.err.txt" -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue

          # Sanity checks on the finished package.
          $finishedExe = Join-Path $generated "An_Otters_Quest.exe"
          $finishedJar = Join-Path $generated "processing-py.jar"
          $finishedJava = Join-Path $generated "jre\bin\javaw.exe"
          $finishedSketch = Join-Path $generated "runtime\sketch.py"
          foreach ($file in @($finishedExe, $finishedJar, $finishedJava, $finishedSketch)) {
            if (-not (Test-Path $file)) {
              throw "Finished package is missing: $file"
            }
          }

          $zipOut = Join-Path $repoRoot "An-Otters-Quest-Windows-x64.zip"
          Compress-Archive -Path (Join-Path $generated "*") -DestinationPath $zipOut -CompressionLevel Optimal -Force

          Write-Host "Created: $zipOut"
          Write-Host "ZIP size: $((Get-Item $zipOut).Length) bytes"
          Get-ChildItem -Path $generated | Format-Table Name, Length, Mode

      - name: Upload portable game
        uses: actions/upload-artifact@v4
        with:
          name: An-Otters-Quest-Windows-x64
          path: An-Otters-Quest-Windows-x64.zip
          if-no-files-found: error
          compression-level: 0
